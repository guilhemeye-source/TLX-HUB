<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Wall</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    background: #080808;
    color: white;
}

.app {
    min-height: 100vh;
    display: flex;
}

/* ================= EDITOR ================= */

.editor {
    width: 380px;
    background: #111;
    border-right: 1px solid #292929;
    padding: 25px;
    overflow-y: auto;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 25px;
}

.logo span {
    color: #a855f7;
}

label {
    display: block;
    font-size: 13px;
    color: #aaa;
    margin: 17px 0 7px;
}

input,
textarea,
select {
    width: 100%;
    background: #1c1c1c;
    border: 1px solid #333;
    color: white;
    border-radius: 10px;
    padding: 12px;
    outline: none;
}

textarea {
    height: 80px;
    resize: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #a855f7;
}

button {
    border: none;
    cursor: pointer;
}

.save {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border-radius: 10px;
    background: #a855f7;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

.save:hover {
    opacity: .9;
}

.share {
    width: 100%;
    margin-top: 10px;
    padding: 13px;
    border-radius: 10px;
    background: #222;
    color: white;
    font-weight: bold;
}

/* ================= PREVIEW ================= */

.preview-area {
    flex: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    background:
        radial-gradient(circle at top, #241331, transparent 45%),
        #070707;
}

.phone {
    width: 390px;
    max-width: 100%;
    min-height: 700px;
    border-radius: 28px;
    padding: 35px 22px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(160deg, #181818, #080808);
    box-shadow: 0 20px 80px rgba(0,0,0,.6);
    text-align: center;
}

.profile-photo {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid white;
    margin-bottom: 14px;
    background: #222;
}

.username {
    font-size: 24px;
    font-weight: bold;
}

.handle {
    color: #999;
    margin-top: 4px;
}

.bio {
    margin: 15px auto 22px;
    max-width: 300px;
    color: #ccc;
    line-height: 1.5;
    white-space: pre-line;
}

.links {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.link {
    display: block;
    padding: 15px;
    border-radius: 13px;
    background: rgba(255,255,255,.1);
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: .2s;
    border: 1px solid rgba(255,255,255,.08);
}

.link:hover {
    transform: scale(1.02);
    background: rgba(255,255,255,.17);
}

.footer {
    margin-top: 30px;
    color: #666;
    font-size: 12px;
}

/* ================= THEMES ================= */

.theme-purple {
    background: linear-gradient(160deg, #28103c, #080808);
}

.theme-blue {
    background: linear-gradient(160deg, #082b45, #080808);
}

.theme-pink {
    background: linear-gradient(160deg, #450d2d, #080808);
}

.theme-green {
    background: linear-gradient(160deg, #093b29, #080808);
}

.theme-red {
    background: linear-gradient(160deg, #430d0d, #080808);
}

.theme-white {
    background: linear-gradient(160deg, #eeeeee, #cfcfcf);
    color: #111;
}

.theme-white .handle,
.theme-white .bio,
.theme-white .footer {
    color: #444;
}

.theme-white .link {
    background: rgba(0,0,0,.08);
    color: #111;
}

/* ================= RESPONSIVE ================= */

@media (max-width: 800px) {
    .app {
        flex-direction: column;
    }

    .editor {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #292929;
    }

    .preview-area {
        min-height: 800px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- EDITOR -->
    <div class="editor">

        <div class="logo">
            Profile<span>Wall</span>
        </div>

        <label>Foto de perfil</label>
        <input type="file" id="photo" accept="image/*">

        <label>Nome</label>
        <input id="name" placeholder="Seu nome">

        <label>@Usuário</label>
        <input id="username" placeholder="@seunome">

        <label>Bio</label>
        <textarea id="bio" placeholder="Escreva alguma coisa sobre você..."></textarea>

        <label>Instagram</label>
        <input id="instagram" placeholder="https://instagram.com/">

        <label>TikTok</label>
        <input id="tiktok" placeholder="https://tiktok.com/@">

        <label>YouTube</label>
        <input id="youtube" placeholder="https://youtube.com/">

        <label>Discord</label>
        <input id="discord" placeholder="https://discord.com/">

        <label>Outro link</label>
        <input id="other" placeholder="https://seusite.com">

        <label>Tema</label>
        <select id="theme">
            <option value="theme-purple">Roxo</option>
            <option value="theme-blue">Azul</option>
            <option value="theme-pink">Rosa</option>
            <option value="theme-green">Verde</option>
            <option value="theme-red">Vermelho</option>
            <option value="theme-white">Claro</option>
        </select>

        <button class="save" onclick="saveProfile()">
            💾 Salvar perfil
        </button>

        <button class="share" onclick="shareProfile()">
            🔗 Compartilhar perfil
        </button>

    </div>


    <!-- PREVIEW -->
    <div class="preview-area">

        <div class="phone theme-purple" id="profile">

            <img
                id="previewPhoto"
                class="profile-photo"
                src="https://placehold.co/200x200/222/fff?text=Foto"
            >

            <div class="username" id="previewName">
                Seu Nome
            </div>

            <div class="handle" id="previewUsername">
                @seunome
            </div>

            <div class="bio" id="previewBio">
                Sua bio aparecerá aqui.
            </div>

            <div class="links" id="links">

                <a id="instagramLink"
                   class="link"
                   href="#"
                   target="_blank"
                   style="display:none;">
                    📸 Instagram
                </a>

                <a id="tiktokLink"
                   class="link"
                   href="#"
                   target="_blank"
                   style="display:none;">
                    🎵 TikTok
                </a>

                <a id="youtubeLink"
                   class="link"
                   href="#"
                   target="_blank"
                   style="display:none;">
                    ▶️ YouTube
                </a>

                <a id="discordLink"
                   class="link"
                   href="#"
                   target="_blank"
                   style="display:none;">
                    💬 Discord
                </a>

                <a id="otherLink"
                   class="link"
                   href="#"
                   target="_blank"
                   style="display:none;">
                    🔗 Meu link
                </a>

            </div>

            <div class="footer">
                Criado com ProfileWall
            </div>

        </div>

    </div>

</div>


<script>

const fields = [
    "name",
    "username",
    "bio",
    "instagram",
    "tiktok",
    "youtube",
    "discord",
    "other",
    "theme"
];

fields.forEach(id => {
    document.getElementById(id).addEventListener("input", updatePreview);
    document.getElementById(id).addEventListener("change", updatePreview);
});

document.getElementById("photo").addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {
        document.getElementById("previewPhoto").src =
            event.target.result;

        localStorage.setItem(
            "profilePhoto",
            event.target.result
        );
    };

    reader.readAsDataURL(file);
});


function updatePreview() {

    document.getElementById("previewName").textContent =
        document.getElementById("name").value || "Seu Nome";

    document.getElementById("previewUsername").textContent =
        document.getElementById("username").value || "@seunome";

    document.getElementById("previewBio").textContent =
        document.getElementById("bio").value ||
        "Sua bio aparecerá aqui.";

    updateLink(
        "instagram",
        "instagramLink",
        "📸 Instagram"
    );

    updateLink(
        "tiktok",
        "tiktokLink",
        "🎵 TikTok"
    );

    updateLink(
        "youtube",
        "youtubeLink",
        "▶️ YouTube"
    );

    updateLink(
        "discord",
        "discordLink",
        "💬 Discord"
    );

    updateLink(
        "other",
        "otherLink",
        "🔗 Meu link"
    );

    const profile =
        document.getElementById("profile");

    profile.className =
        "phone " +
        document.getElementById("theme").value;
}


function updateLink(inputId, linkId, text) {

    const value =
        document.getElementById(inputId).value.trim();

    const link =
        document.getElementById(linkId);

    if (value) {

        link.style.display = "block";

        link.href = normalizeURL(value);

        link.textContent = text;

    } else {

        link.style.display = "none";

    }
}


function normalizeURL(url) {

    if (
        url.startsWith("http://") ||
        url.startsWith("https://")
    ) {
        return url;
    }

    return "https://" + url;
}


function saveProfile() {

    const data = {};

    fields.forEach(id => {
        data[id] =
            document.getElementById(id).value;
    });

    localStorage.setItem(
        "profileWall",
        JSON.stringify(data)
    );

    alert("✅ Perfil salvo!");
}


function loadProfile() {

    const saved =
        localStorage.getItem("profileWall");

    if (saved) {

        const data = JSON.parse(saved);

        fields.forEach(id => {

            if (data[id] !== undefined) {
                document.getElementById(id).value =
                    data[id];
            }

        });
    }

    const photo =
        localStorage.getItem("profilePhoto");

    if (photo) {
        document.getElementById("previewPhoto").src =
            photo;
    }

    updatePreview();
}


async function shareProfile() {

    const username =
        document.getElementById("username").value ||
        "meu-perfil";

    const url =
        window.location.href.split("#")[0] +
        "#" +
        encodeURIComponent(username);

    if (navigator.share) {

        try {

            await navigator.share({
                title: "Meu ProfileWall",
                text: "Confira meu perfil!",
                url: url
            });

        } catch (error) {}

    } else {

        try {

            await navigator.clipboard.writeText(url);

            alert(
                "🔗 Link copiado!\n\n" +
                url
            );

        } catch (error) {

            prompt(
                "Copie seu link:",
                url
            );

        }

    }
}


loadProfile();

</script>

</body>
  </html>
