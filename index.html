<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0d0f12;
  color:white;
  height:100vh;
}

/* LOGIN */

#login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:380px;
  background:#171a1f;
  border:1px solid #292e36;
  border-radius:18px;
  padding:30px;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:25px;
}

.logo span{
  color:#7c5cff;
}

.login-box input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #303640;
  background:#0e1115;
  color:white;
  outline:none;
}

.login-box button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#7c5cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#error{
  color:#ff7070;
  text-align:center;
  margin-top:12px;
  font-size:14px;
}

/* CHAT */

#chat{
  display:none;
  height:100vh;
}

.app{
  display:flex;
  height:100%;
}

/* LISTA */

.sidebar{
  width:330px;
  background:#15181d;
  border-right:1px solid #292e36;
  display:flex;
  flex-direction:column;
}

.top{
  padding:18px;
  border-bottom:1px solid #292e36;
}

.top h2{
  margin-bottom:15px;
}

.search{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #303640;
  background:#0e1115;
  color:white;
  outline:none;
}

.users{
  overflow:auto;
  flex:1;
}

.user{
  padding:15px 18px;
  border-bottom:1px solid #22262c;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:12px;
}

.user:hover,
.user.active{
  background:#22202d;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#7c5cff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.user-name{
  font-weight:bold;
}

.user-status{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

/* CONVERSA */

.conversation{
  flex:1;
  display:flex;
  flex-direction:column;
}

.chat-header{
  padding:17px 20px;
  border-bottom:1px solid #292e36;
  font-weight:bold;
}

.messages{
  flex:1;
  overflow:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.message{
  max-width:70%;
  padding:10px 13px;
  border-radius:13px;
  background:#252a31;
  align-self:flex-start;
  word-wrap:break-word;
}

.message.mine{
  background:#7c5cff;
  align-self:flex-end;
}

.message-box{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid #292e36;
}

.message-box input{
  flex:1;
  padding:13px;
  border-radius:10px;
  border:1px solid #303640;
  background:#0e1115;
  color:white;
  outline:none;
}

.message-box button{
  width:55px;
  border:0;
  border-radius:10px;
  background:#7c5cff;
  color:white;
  cursor:pointer;
  font-size:18px;
}

.no-chat{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#666;
}

/* MOBILE */

@media(max-width:700px){

  .sidebar{
    width:100%;
  }

  .conversation{
    display:none;
  }

  .sidebar.mobile-hidden{
    display:none;
  }

  .conversation.mobile-show{
    display:flex;
  }

  .back{
    display:inline-block;
    margin-right:10px;
    cursor:pointer;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

  <div class="login-box">

    <div class="logo">
      <span>Chat</span>
    </div>

    <input
      id="name"
      type="text"
      placeholder="Seu nome"
      maxlength="30"
    >

    <input
      id="password"
      type="password"
      placeholder="Senha"
      maxlength="50"
    >

    <button onclick="login()">
      Entrar / Criar conta
    </button>

    <div id="error"></div>

  </div>

</div>


<!-- CHAT -->

<div id="chat">

  <div class="app">

    <!-- USUÁRIOS -->

    <aside class="sidebar" id="sidebar">

      <div class="top">

        <h2>Conversas</h2>

        <input
          class="search"
          id="search"
          placeholder="🔎 Pesquisar pessoa..."
          oninput="searchUsers()"
        >

      </div>

      <div class="users" id="users"></div>

    </aside>


    <!-- CONVERSA -->

    <main class="conversation" id="conversation">

      <div class="no-chat" id="noChat">
        Escolha uma pessoa para conversar
      </div>

      <div id="activeChat" style="display:none;height:100%;flex-direction:column">

        <div class="chat-header" id="chatHeader">
          Conversa
        </div>

        <div class="messages" id="messages"></div>

        <div class="message-box">

          <input
            id="messageInput"
            placeholder="Digite uma mensagem..."
            onkeydown="enterMessage(event)"
          >

          <button onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

    </main>

  </div>

</div>


<script>

/*
  DADOS LOCAIS

  Esta versão usa localStorage.
  Para chat real entre celulares diferentes,
  será necessário um backend/banco de dados.
*/

let currentUser = null;
let selectedUser = null;


/* CONTAS */

let accounts =
  JSON.parse(localStorage.getItem("chat_accounts") || "[]");


/* MENSAGENS */

let messages =
  JSON.parse(localStorage.getItem("chat_messages") || "{}");


/* LOGIN */

function login(){

  const name =
    document.getElementById("name")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;


  if(name.length < 2){

    showError("Digite um nome válido.");

    return;

  }


  if(password.length < 3){

    showError("A senha precisa ter pelo menos 3 caracteres.");

    return;

  }


  let user =
    accounts.find(
      u => u.name.toLowerCase() === name.toLowerCase()
    );


  if(user){

    if(user.password !== password){

      showError("Senha incorreta.");

      return;

    }

  }else{

    user = {
      name:name,
      password:password
    };

    accounts.push(user);

    saveAccounts();

  }


  currentUser = user;

  document.getElementById("login").style.display =
    "none";

  document.getElementById("chat").style.display =
    "block";

  renderUsers();

}


/* ERRO */

function showError(text){

  document.getElementById("error")
    .textContent = text;

}


/* USUÁRIOS */

function renderUsers(){

  const list =
    document.getElementById("users");

  const search =
    document.getElementById("search")
      .value.toLowerCase();


  const filtered =
    accounts.filter(user =>
      user.name !== currentUser.name &&
      user.name.toLowerCase().includes(search)
    );


  if(filtered.length === 0){

    list.innerHTML =
      `<div style="padding:25px;color:#666;text-align:center">
        Nenhuma pessoa encontrada.
      </div>`;

    return;

  }


  list.innerHTML = "";


  filtered.forEach(user => {

    const div =
      document.createElement("div");

    div.className =
      "user" +
      (selectedUser === user.name ? " active" : "");


    div.onclick =
      () => openChat(user.name);


    div.innerHTML = `

      <div class="avatar">
        ${escapeHTML(user.name.charAt(0).toUpperCase())}
      </div>

      <div>

        <div class="user-name">
          ${escapeHTML(user.name)}
        </div>

        <div class="user-status">
          Clique para conversar
        </div>

      </div>

    `;


    list.appendChild(div);

  });

}


/* PESQUISA */

function searchUsers(){

  renderUsers();

}


/* ABRIR CONVERSA */

function openChat(username){

  selectedUser = username;


  document.getElementById("noChat")
    .style.display = "none";


  document.getElementById("activeChat")
    .style.display = "flex";


  document.getElementById("chatHeader")
    .textContent = username;


  renderMessages();


  renderUsers();

}


/* ID DA CONVERSA */

function conversationId(a,b){

  return [a,b]
    .sort()
    .join("__");

}


/* MOSTRAR MENSAGENS */

function renderMessages(){

  const container =
    document.getElementById("messages");


  const id =
    conversationId(
      currentUser.name,
      selectedUser
    );


  const chatMessages =
    messages[id] || [];


  container.innerHTML = "";


  chatMessages.forEach(msg => {

    const div =
      document.createElement("div");

    div.className =
      "message" +
      (msg.from === currentUser.name
        ? " mine"
        : "");


    div.textContent =
      msg.text;


    container.appendChild(div);

  });


  container.scrollTop =
    container.scrollHeight;

}


/* ENVIAR */

function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();


  if(!text || !selectedUser)
    return;


  const id =
    conversationId(
      currentUser.name,
      selectedUser
    );


  if(!messages[id])
    messages[id] = [];


  messages[id].push({

    from:currentUser.name,

    to:selectedUser,

    text:text,

    time:Date.now()

  });


  localStorage.setItem(
    "chat_messages",
    JSON.stringify(messages)
  );


  input.value = "";

  renderMessages();

}


/* ENTER */

function enterMessage(event){

  if(event.key === "Enter"){

    sendMessage();

  }

}


/* SALVAR CONTAS */

function saveAccounts(){

  localStorage.setItem(
    "chat_accounts",
    JSON.stringify(accounts)
  );

}


/* SEGURANÇA */

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
