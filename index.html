<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Diário ✨</title>

<style>
:root {
    --cor-primaria: #a855f7;
    --cor-secundaria: #ec4899;
    --cor-fundo: #faf8fc;
    --cor-texto: #29252d;
    --cor-texto-suave: #77717c;
    --cor-borda: #ded8e2;
    --sombra-suave: 0 8px 25px rgba(70,50,80,.07);
    --sombra-forte: 0 20px 60px rgba(70,40,90,.15);
    --raio-borda: 18px;
    --transicao: all 0.3s ease;
}

*{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body{
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(circle at 10% 10%, #ffd6ec, transparent 35%),
        radial-gradient(circle at 90% 90%, #d9ccff, transparent 35%),
        var(--cor-fundo);
    color: var(--cor-texto);
    line-height: 1.6;
}

.hidden{
    display: none !important;
}

button, input, textarea{
    font-family: inherit;
    font-size: 100%;
}

button{
    transition: var(--transicao);
}

button:hover{
    transform: translateY(-1px);
}

button:active{
    transform: translateY(0);
}

/* === LOGIN === */

#loginPage{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card{
    width: 100%;
    max-width: 420px;
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(24px);
    border-radius: 32px;
    padding: 36px 30px;
    box-shadow: var(--sombra-forte);
    animation: aparecer 0.5s ease-out;
}

@keyframes aparecer {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}

.logo{
    text-align: center;
    font-size: 60px;
    margin-bottom: 8px;
    filter: drop-shadow(0 4px 6px rgba(168,85,247,.15));
}

h1{
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--cor-primaria), var(--cor-secundaria));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.subtitle{
    text-align: center;
    color: var(--cor-texto-suave);
    margin: 6px 0 28px;
}

.tabs{
    display: flex;
    background: #f1edf4;
    padding: 5px;
    border-radius: 16px;
    margin-bottom: 24px;
}

.tabs button{
    width: 50%;
    padding: 13px;
    border: none;
    background: transparent;
    border-radius: 13px;
    cursor: pointer;
    font-weight: 500;
    color: var(--cor-texto-suave);
    transition: var(--transicao);
}

.tabs .active{
    background: white;
    box-shadow: 0 4px 14px rgba(0,0,0,.08);
    color: var(--cor-primaria);
    font-weight: 600;
}

.input{
    width: 100%;
    padding: 16px;
    border: 2px solid var(--cor-borda);
    border-radius: var(--raio-borda);
    outline: none;
    margin-bottom: 14px;
    font-size: 15px;
    background: white;
    transition: var(--transicao);
}

.input:focus{
    border-color: var(--cor-primaria);
    box-shadow: 0 0 0 4px rgba(168,85,247,.12);
}

.mainButton{
    width: 100%;
    border: none;
    padding: 16px;
    border-radius: var(--raio-borda);
    background: linear-gradient(135deg, var(--cor-primaria), var(--cor-secundaria));
    color: white;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(168,85,247,.25);
}

.mainButton:hover{
    box-shadow: 0 8px 24px rgba(168,85,247,.35);
}

.message{
    text-align: center;
    margin-top: 16px;
    font-size: 14px;
    min-height: 20px;
}

.erro { color: #d83d63; }
.sucesso { color: #2f9c64; }

/* === APP === */

header{
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(255,255,255,.8);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0,0,0,.05);
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,.04);
}

.brand{
    font-size: 22px;
    font-weight: bold;
}

.brand span{
    color: var(--cor-primaria);
}

.logout{
    border: none;
    background: #f0ebf3;
    padding: 11px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 500;
}

.logout:hover{
    background: #e6dff0;
}

.container{
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
}

.welcome{
    margin-bottom: 28px;
}

.welcome h2{
    font-size: 30px;
    margin-bottom: 6px;
}

.welcome p{
    color: var(--cor-texto-suave);
    font-size: 16px;
}

.editor{
    background: rgba(255,255,255,.92);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 18px 50px rgba(70,50,80,.12);
    margin-bottom: 10px;
}

#title{
    width: 100%;
    border: none;
    outline: none;
    font-size: 24px;
    font-weight: 700;
    background: transparent;
    margin-bottom: 16px;
    color: var(--cor-texto);
}

#title::placeholder,
#text::placeholder { color: #b4aebc; }

#text{
    width: 100%;
    min-height: 200px;
    max-height: 60vh;
    resize: vertical;
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    line-height: 1.8;
    color: var(--cor-texto);
}

.editorBottom{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    flex-wrap: wrap;
}

.save{
    border: none;
    background: var(--cor-texto);
    color: white;
    padding: 13px 24px;
    border-radius: 14px;
    font-weight: bold;
    cursor: pointer;
}

.save:hover{
    background: #17141a;
}

.status{
    color: var(--cor-texto-suave);
    font-size: 14px;
}

.entries{
    margin-top: 40px;
}

.entries h3{
    margin-bottom: 18px;
    font-size: 20px;
}

.entry{
    background: rgba(255,255,255,.94);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: var(--sombra-suave);
    transition: var(--transicao);
    border-left: 4px solid var(--cor-primaria);
}

.entry:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(70,50,80,.1);
}

.entry-actions{
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
}

.date{
    font-size: 13px;
    color: #99909f;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.entry h4{
    font-size: 20px;
    margin-bottom: 10px;
    color: var(--cor-texto);
}

.entry p{
    white-space: pre-wrap;
    line-height: 1.7;
    color: #554f58;
}

.edit{
    border: none;
    background: #f0ebff;
    color: #7c3aed;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
}

.delete{
    border: none;
    background: #fff0f3;
    color: #d83d63;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
}

.empty{
    text-align: center;
    color: #89818d;
    padding: 40px 20px;
    font-style: italic;
}

/* Responsivo */
@media(max-width: 600px){
    .card{ padding: 28px 20px; }
    h1{ font-size: 26px; }
    .welcome h2{ font-size: 26px; }
    .editor{ padding: 18px; border-radius: 22px; }
    .editorBottom{ flex-direction: column; align-items: flex-start; }
    .save{ width: 100%; text-align: center; }
    .entry-actions{ flex-direction: column; }
    .entry-actions button{ width: 100%; }
}
</style>
</head>

<body>

<!-- === TELA DE LOGIN === -->
<div id="loginPage">
<div class="card">
<div class="logo">📖</div>
<h1>Meu Diário</h1>
<p class="subtitle">Seu espaço particular e seguro ✨</p>

<div class="tabs">
<button id="loginTab" class="active" onclick="changeMode('login')">Entrar</button>
<button id="registerTab" onclick="changeMode('register')">Criar conta</button>
</div>

<input id="username" class="input" placeholder="Nome de usuário" autocomplete="username" spellcheck="false">
<input id="password" class="input" type="password" placeholder="Senha" autocomplete="current-password">

<button class="mainButton" onclick="authenticate()">
<span id="buttonText">Entrar</span>
</button>

<div id="message" class="message"></div>
</div>
</div>

<!-- === ÁREA DO DIÁRIO === -->
<div id="app" class="hidden">
<header>
<div class="brand">📖 <span>Meu Diário</span></div>
<button class="logout" onclick="logout()">🚪 Sair</button>
</header>

<main class="container">
<div class="welcome">
<h2>Olá, <span id="userName"></span>! 👋</h2>
<p>Escreva seus pensamentos, memórias e ideias. Tudo salvo com segurança.</p>
</div>

<div class="editor">
<input id="title" placeholder="Título da anotação...">
<textarea id="text" placeholder="O que está pensando hoje? ✍️"></textarea>
<div class="editorBottom">
<span id="status" class="status">Tudo pronto.</span>
<button class="save" onclick="saveEntry()">💾 Salvar</button>
</div>
</div>

<div class="entries">
<h3>📚 Minhas anotações</h3>
<div id="entriesList"></div>
</div>
</main>
</div>

<script>
let mode = "login";
let currentUser = null;
let editingId = null;

/* ===================
   UTILIDADES
=================== */
function getUsers(){
    return JSON.parse(localStorage.getItem("diary_users") || "{}");
}

function saveUsers(users){
    localStorage.setItem("diary_users", JSON.stringify(users));
}

function getDiaryKey(){
    return "diary_entries_" + currentUser;
}

function getEntries(){
    return JSON.parse(localStorage.getItem(getDiaryKey()) || "[]");
}

function saveEntries(entries){
    localStorage.setItem(getDiaryKey(), JSON.stringify(entries));
}

function mostrarStatus(elemento, texto, tipo=""){
    elemento.textContent = texto;
    elemento.className = tipo === "erro" ? "message erro" 
                       : tipo === "sucesso" ? "message sucesso" 
                       : "message";
}

/* ===================
   LOGIN / CADASTRO
=================== */
function changeMode(newMode){
    mode = newMode;
    document.getElementById("loginTab").classList.toggle("active", mode === "login");
    document.getElementById("registerTab").classList.toggle("active", mode === "register");
    document.getElementById("buttonText").textContent = mode === "login" ? "Entrar" : "Criar conta";
    document.getElementById("message").textContent = "";
    editingId = null;
}

function authenticate(){
    const username = document.getElementById("username").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const message = document.getElementById("message");

    if(!username || !password) return mostrarStatus(message, "⚠️ Preencha todos os campos.", "erro");
    if(username.length < 3) return mostrarStatus(message, "⚠️ Nome precisa ter pelo menos 3 caracteres.", "erro");
    if(password.length < 6) return mostrarStatus(message, "⚠️ Senha precisa ter pelo menos 6 caracteres.", "erro");

    const users = getUsers();

    if(mode === "register"){
        if(users[username]) return mostrarStatus(message, "⚠️ Esse usuário já existe.", "erro");
        users[username] = { password: btoa(password) };
        saveUsers(users);
        mostrarStatus(message, "✅ Conta criada! Entrando...", "sucesso");
        setTimeout(() => login(username), 600);
    }else{
        if(!users[username]) return mostrarStatus(message, "⚠️ Usuário ou senha incorretos.", "erro");
        if(atob(users[username].password) !== password) 
            return mostrarStatus(message, "⚠️ Usuário ou senha incorretos.", "erro");
        login(username);
    }
}

/* ===================
   ENTRAR / SAIR
=================== */
function login(username){
    currentUser = username;
    sessionStorage.setItem("current_diary_user", username);
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("userName").textContent = username;
    loadEntries();
}

function logout(){
    currentUser = null;
    sessionStorage.removeItem("current_diary_user");
    document.getElementById("app").classList.add("hidden");
    document.getElementById("loginPage").classList.remove("hidden");
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("message").textContent = "";
    editingId = null;
}

/* ===================
   SALVAR / EDITAR
=================== */
function saveEntry(){
    const title = document.getElementById("title").value.trim();
    const text = document.getElementById("text").value.trim();
    const status = document.getElementById("status");

    if(!text) return status.textContent = "⚠️ Escreva algo primeiro.";

    const entries = getEntries();

    if(editingId){
        const idx = entries.findIndex(e => e.id === editingId);
        if(idx !== -1){
            entries[idx].title = title || "Sem título";
            entries[idx].text = text;
            entries[idx].date = new Date().toLocaleString("pt-BR") + " (editado)";
        }
        editingId = null;
        document.querySelector(".save").innerHTML = "💾 Salvar";
    }else{
        entries.unshift({
            id: Date.now(),
            title: title || "Sem título",
            text: text,
            date: new Date().toLocaleString("pt-BR")
        });
    }

    saveEntries(entries);
    document.getElementById("title").value = "";
    document.getElementById("text").value = "";
    status.textContent = "✅ Salvo!";
    setTimeout(() => status.textContent = "Tudo pronto.", 2500);
    loadEntries();
}

/* ===================
   CARREGAR ANOTAÇÕES
=================== */
function loadEntries(){
    const list = document.getElementById("entriesList");
    const entries = getEntries();
    list.innerHTML = "";

    if(entries.length === 0){
        list.innerHTML = '<div class="empty">Você ainda não escreveu nada. Comece sua primeira anotação! ✨</div>';
        return;
    }

    entries.forEach(entry => {
        const div = document.createElement("div");
        div.className = "entry";
        div.innerHTML = `
            <div class="date">📅 ${escapeHTML(entry.date)}</div>
            <h4>${escapeHTML(entry.title)}</h4>
            <p>${escapeHTML(entry.text)}</p>
            <div class="entry-actions">
                <button class="edit" onclick="editEntry(${entry.id})">✏️ Editar</button>
                <button class="delete" onclick="deleteEntry(${entry.id})">🗑️ Excluir</button>
            </div>
        `;
        list.appendChild(div);
    });
}

/* ===================
   EDITAR / EXCLUIR
=================== */
function editEntry(id){
    const entries = getEntries();
    const entry = entries.find(e => e.id === id);
    if(!entry) return;

    document.getElementById("title").value = entry.title === "Sem título" ? "" : entry.title;
    document.getElementById("text").value = entry.text;
    editingId = id;
    document.querySelector(".save").innerHTML = "🔄 Atualizar";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function deleteEntry(id){
    if(!confirm("Tem certeza que deseja excluir esta anotação?")) return;
    let entries = getEntries().filter(entry => entry.id !== id);
    saveEntries(entries);
    loadEntries();
}

/* ===================
   SEGURANÇA
=================== */
function escapeHTML(text){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* ===================
   INICIALIZAÇÃO
=================== */
function checkLogin(){
    const savedUser = sessionStorage.getItem("current_diary_user");
    if(savedUser && getUsers()[savedUser]) login(savedUser);
}

// Permitir Enter para logar/cadastrar
document.addEventListener("keydown", e => {
    if(e.key === "Enter") authenticate();
});

checkLogin();
</script>
</body>
</html>
