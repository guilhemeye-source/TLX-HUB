<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BotPanel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#0b0d10;
  color:#fff;
}
button,input,textarea,select{font:inherit}

.app{display:flex;min-height:100vh}

.sidebar{
  width:240px;
  background:#12151a;
  border-right:1px solid #252a31;
  padding:20px 14px;
}

.logo{
  font-size:24px;
  font-weight:800;
  margin-bottom:25px;
  padding:0 8px;
}

.logo span{color:#7c5cff}

.nav button{
  width:100%;
  padding:12px;
  margin:4px 0;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#aaa;
  text-align:left;
  cursor:pointer;
}

.nav button:hover,
.nav button.active{
  background:#24202f;
  color:#fff;
}

.main{
  flex:1;
  padding:25px;
  max-width:1200px;
  margin:auto;
  width:100%;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.header h1{font-size:27px}

.primary{
  background:#7c5cff;
  color:white;
  border:0;
  border-radius:10px;
  padding:11px 16px;
  font-weight:bold;
  cursor:pointer;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:#15191f;
  border:1px solid #252a31;
  border-radius:14px;
  padding:20px;
}

.card small{color:#888}
.card strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.panel{
  background:#15191f;
  border:1px solid #252a31;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}

.panel h2{
  font-size:18px;
  margin-bottom:15px;
}

.search{
  width:100%;
  background:#0f1216;
  border:1px solid #303640;
  color:#fff;
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  outline:none;
}

.command{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:14px 0;
  border-bottom:1px solid #252a31;
}

.command:last-child{border-bottom:0}

.command-info{
  min-width:0;
}

.command-name{
  color:#9b82ff;
  font-weight:bold;
}

.command-response{
  color:#aaa;
  margin-top:5px;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.actions{
  display:flex;
  gap:7px;
}

.secondary,
.danger{
  border:0;
  padding:8px 11px;
  border-radius:8px;
  cursor:pointer;
}

.secondary{
  background:#292e36;
  color:#fff;
}

.danger{
  background:#401e24;
  color:#ff8b99;
}

.toggle{
  width:42px;
  height:23px;
  border-radius:20px;
  border:0;
  background:#444;
  cursor:pointer;
  position:relative;
}

.toggle.on{background:#7c5cff}

.toggle:after{
  content:"";
  width:17px;
  height:17px;
  background:white;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:.2s;
}

.toggle.on:after{left:22px}

.product{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #252a31;
}

.price{color:#7cffb2;font-weight:bold}

.empty{
  color:#777;
  text-align:center;
  padding:30px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#171a20;
  border:1px solid #303640;
  border-radius:16px;
  padding:22px;
}

.modal-box h2{margin-bottom:18px}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin:12px 0 6px;
}

.modal-box input,
.modal-box textarea,
.modal-box select{
  width:100%;
  background:#0e1115;
  color:#fff;
  border:1px solid #303640;
  border-radius:9px;
  padding:11px;
  outline:none;
}

.modal-box textarea{
  min-height:100px;
  resize:vertical;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.modal-actions button{
  flex:1;
  padding:11px;
  border:0;
  border-radius:9px;
  cursor:pointer;
}

.cancel{background:#292e36;color:#fff}
.save{background:#7c5cff;color:#fff}

.section{display:none}
.section.active{display:block}

@media(max-width:750px){
  .sidebar{
    width:70px;
    padding:15px 8px;
  }

  .logo{
    font-size:0;
    text-align:center;
  }

  .logo span{
    font-size:22px;
  }

  .nav button{
    font-size:0;
    text-align:center;
  }

  .nav button:first-letter{
    font-size:20px;
  }

  .main{padding:15px}

  .cards{
    grid-template-columns:1fr;
  }

  .command{
    align-items:flex-start;
    flex-direction:column;
  }

  .actions{width:100%}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="logo">
    Bot<span>Panel</span>
  </div>

  <div class="nav">
    <button class="active" onclick="showSection('dashboard',this)">
      🏠 Dashboard
    </button>

    <button onclick="showSection('commands',this)">
      ⚡ Comandos
    </button>

    <button onclick="showSection('products',this)">
      🛒 Produtos
    </button>

    <button onclick="showSection('settings',this)">
      ⚙️ Configurações
    </button>
  </div>

</aside>


<main class="main">

<!-- DASHBOARD -->

<section id="dashboard" class="section active">

  <div class="header">
    <h1>Dashboard</h1>
  </div>

  <div class="cards">

    <div class="card">
      <small>Comandos</small>
      <strong id="statCommands">0</strong>
    </div>

    <div class="card">
      <small>Comandos ativos</small>
      <strong id="statActive">0</strong>
    </div>

    <div class="card">
      <small>Produtos</small>
      <strong id="statProducts">0</strong>
    </div>

  </div>

  <div class="panel">
    <h2>🤖 Seu bot</h2>
    <p style="color:#aaa;line-height:1.6">
      Configure os comandos e produtos do seu bot.
      As configurações ficam salvas neste navegador.
    </p>
  </div>

</section>


<!-- COMANDOS -->

<section id="commands" class="section">

  <div class="header">

    <h1>Comandos</h1>

    <button class="primary" onclick="openCommandModal()">
      + Novo comando
    </button>

  </div>

  <div class="panel">

    <input
      class="search"
      id="commandSearch"
      placeholder="🔎 Pesquisar comando..."
      oninput="renderCommands()"
    >

    <div id="commandsList"></div>

  </div>

</section>


<!-- PRODUTOS -->

<section id="products" class="section">

  <div class="header">

    <h1>Produtos</h1>

    <button class="primary" onclick="openProductModal()">
      + Novo produto
    </button>

  </div>

  <div class="panel">

    <div id="productsList"></div>

  </div>

</section>


<!-- CONFIGURAÇÕES -->

<section id="settings" class="section">

  <div class="header">
    <h1>Configurações</h1>
  </div>

  <div class="panel">

    <h2>🤖 Informações do bot</h2>

    <label>Nome do bot</label>

    <input
      id="botName"
      class="search"
      placeholder="Ex: Minha Loja"
      oninput="saveSettings()"
    >

    <label>Mensagem inicial</label>

    <textarea
      id="welcome"
      class="search"
      style="min-height:120px"
      placeholder="Olá! Como posso ajudar?"
      oninput="saveSettings()"
    ></textarea>

  </div>

</section>

</main>

</div>


<!-- MODAL COMANDO -->

<div class="modal" id="commandModal">

  <div class="modal-box">

    <h2 id="commandModalTitle">Novo comando</h2>

    <label>Comando</label>

    <input
      id="commandInput"
      placeholder="/menu"
    >

    <label>Resposta</label>

    <textarea
      id="responseInput"
      placeholder="Digite a resposta do bot..."
    ></textarea>

    <label>Categoria</label>

    <select id="categoryInput">

      <option>Geral</option>
      <option>Vendas</option>
      <option>Pedidos</option>
      <option>Administração</option>
      <option>Atendimento</option>

    </select>

    <div class="modal-actions">

      <button
        class="cancel"
        onclick="closeModals()"
      >
        Cancelar
      </button>

      <button
        class="save"
        onclick="saveCommand()"
      >
        Salvar
      </button>

    </div>

  </div>

</div>


<!-- MODAL PRODUTO -->

<div class="modal" id="productModal">

  <div class="modal-box">

    <h2>Novo produto</h2>

    <label>Nome</label>

    <input
      id="productName"
      placeholder="Ex: Camiseta"
    >

    <label>Preço</label>

    <input
      id="productPrice"
      type="number"
      step="0.01"
      placeholder="29.90"
    >

    <label>Descrição</label>

    <textarea
      id="productDescription"
      placeholder="Descrição do produto..."
    ></textarea>

    <div class="modal-actions">

      <button
        class="cancel"
        onclick="closeModals()"
      >
        Cancelar
      </button>

      <button
        class="save"
        onclick="saveProduct()"
      >
        Salvar
      </button>

    </div>

  </div>

</div>


<script>

let commands =
  JSON.parse(localStorage.getItem("bot_commands") || "[]");

let products =
  JSON.parse(localStorage.getItem("bot_products") || "[]");

let editingCommand = -1;


/* NAVEGAÇÃO */

function showSection(id,button){

  document.querySelectorAll(".section")
    .forEach(section=>{
      section.classList.remove("active");
    });

  document.getElementById(id)
    .classList.add("active");

  document.querySelectorAll(".nav button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });

  button.classList.add("active");

  updateStats();
}


/* MODAL */

function openCommandModal(index=-1){

  editingCommand = index;

  document.getElementById("commandModal").style.display =
    "flex";

  if(index >= 0){

    const c = commands[index];

    document.getElementById("commandModalTitle")
      .textContent = "Editar comando";

    document.getElementById("commandInput").value =
      c.command;

    document.getElementById("responseInput").value =
      c.response;

    document.getElementById("categoryInput").value =
      c.category;

  }else{

    document.getElementById("commandModalTitle")
      .textContent = "Novo comando";

    document.getElementById("commandInput").value = "";

    document.getElementById("responseInput").value = "";

    document.getElementById("categoryInput").value = "Geral";

  }
}


function openProductModal(){

  document.getElementById("productModal").style.display =
    "flex";

  document.getElementById("productName").value = "";

  document.getElementById("productPrice").value = "";

  document.getElementById("productDescription").value = "";

}


function closeModals(){

  document.querySelectorAll(".modal")
    .forEach(modal=>{
      modal.style.display = "none";
    });

}


/* COMANDOS */

function saveCommand(){

  let command =
    document.getElementById("commandInput").value.trim();

  let response =
    document.getElementById("responseInput").value.trim();

  let category =
    document.getElementById("categoryInput").value;


  if(!command || !response){

    alert("Preencha o comando e a resposta.");

    return;
  }


  if(!command.startsWith("/")){

    command = "/" + command;

  }


  const data = {

    command,
    response,
    category,
    active:true

  };


  if(editingCommand >= 0){

    data.active =
      commands[editingCommand].active;

    commands[editingCommand] = data;

  }else{

    commands.push(data);

  }


  saveData();

  closeModals();

  renderCommands();

  updateStats();

}


function renderCommands(){

  const list =
    document.getElementById("commandsList");

  const search =
    document.getElementById("commandSearch")
      .value
      .toLowerCase();


  const filtered =
    commands.filter(c =>
      c.command.toLowerCase().includes(search) ||
      c.response.toLowerCase().includes(search)
    );


  if(!filtered.length){

    list.innerHTML =
      `<div class="empty">Nenhum comando encontrado.</div>`;

    return;

  }


  list.innerHTML = "";


  filtered.forEach(c=>{

    const index =
      commands.indexOf(c);


    const div =
      document.createElement("div");

    div.className = "command";


    div.innerHTML = `

      <div class="command-info">

        <div class="command-name">
          ${escapeHTML(c.command)}
        </div>

        <div class="command-response">
          ${escapeHTML(c.response)}
        </div>

        <small style="color:#666">
          ${escapeHTML(c.category)}
        </small>

      </div>

      <div class="actions">

        <button
          class="toggle ${c.active ? "on" : ""}"
          onclick="toggleCommand(${index})"
          title="Ativar/desativar"
        ></button>

        <button
          class="secondary"
          onclick="openCommandModal(${index})"
        >
          Editar
        </button>

        <button
          class="danger"
          onclick="deleteCommand(${index})"
        >
          Excluir
        </button>

      </div>

    `;

    list.appendChild(div);

  });

}


function toggleCommand(index){

  commands[index].active =
    !commands[index].active;

  saveData();

  renderCommands();

  updateStats();

}


function deleteCommand(index){

  if(!confirm("Excluir este comando?"))
    return;

  commands.splice(index,1);

  saveData();

  renderCommands();

  updateStats();

}


/* PRODUTOS */

function saveProduct(){

  const name =
    document.getElementById("productName")
      .value.trim();

  const price =
    parseFloat(
      document.getElementById("productPrice").value
    );

  const description =
    document.getElementById("productDescription")
      .value.trim();


  if(!name || isNaN(price)){

    alert("Digite o nome e o preço.");

    return;

  }


  products.push({

    name,
    price,
    description

  });


  saveData();

  closeModals();

  renderProducts();

  updateStats();

}


function renderProducts(){

  const list =
    document.getElementById("productsList");


  if(!products.length){

    list.innerHTML =
      `<div class="empty">
        Nenhum produto cadastrado.
      </div>`;

    return;

  }


  list.innerHTML = "";


  products.forEach((p,index)=>{

    const div =
      document.createElement("div");

    div.className = "product";


    div.innerHTML = `

      <div>

        <strong>
          ${escapeHTML(p.name)}
        </strong>

        <div style="color:#888;font-size:13px;margin-top:4px">
          ${escapeHTML(p.description)}
        </div>

      </div>

      <div style="display:flex;align-items:center;gap:12px">

        <span class="price">
          R$ ${p.price.toFixed(2)}
        </span>

        <button
          class="danger"
          onclick="deleteProduct(${index})"
        >
          Excluir
        </button>

      </div>

    `;

    list.appendChild(div);

  });

}


function deleteProduct(index){

  if(!confirm("Excluir este produto?"))
    return;

  products.splice(index,1);

  saveData();

  renderProducts();

  updateStats();

}


/* CONFIGURAÇÕES */

function saveSettings(){

  localStorage.setItem(
    "bot_name",
    document.getElementById("botName").value
  );

  localStorage.setItem(
    "bot_welcome",
    document.getElementById("welcome").value
  );

}


/* ESTATÍSTICAS */

function updateStats(){

  document.getElementById("statCommands")
    .textContent = commands.length;

  document.getElementById("statActive")
    .textContent =
      commands.filter(c=>c.active).length;

  document.getElementById("statProducts")
    .textContent = products.length;

}


/* SALVAR */

function saveData(){

  localStorage.setItem(
    "bot_commands",
    JSON.stringify(commands)
  );

  localStorage.setItem(
    "bot_products",
    JSON.stringify(products)
  );

}


/* SEGURANÇA */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* CARREGAR */

function load(){

  document.getElementById("botName").value =
    localStorage.getItem("bot_name") || "";

  document.getElementById("welcome").value =
    localStorage.getItem("bot_welcome") || "";

  renderCommands();
  renderProducts();
  updateStats();

}


load();

</script>

</body>
  </html>
