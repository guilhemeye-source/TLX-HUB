<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Diário</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 10%,#ffd6ec,transparent 35%),
        radial-gradient(circle at 90% 90%,#d9ccff,transparent 35%),
        #faf8fc;
    color:#29252d;
}

.hidden{
    display:none!important;
}

button,
input,
textarea{
    font-family:inherit;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:410px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(20px);
    border-radius:28px;
    padding:30px;
    box-shadow:0 20px 60px rgba(70,40,90,.15);
}

.logo{
    text-align:center;
    font-size:55px;
    margin-bottom:8px;
}

h1{
    text-align:center;
    font-size:30px;
}

.subtitle{
    text-align:center;
    color:#77717c;
    margin:8px 0 25px;
}

.tabs{
    display:flex;
    background:#f1edf4;
    padding:4px;
    border-radius:14px;
    margin-bottom:20px;
}

.tabs button{
    width:50%;
    padding:12px;
    border:0;
    background:transparent;
    border-radius:11px;
    cursor:pointer;
}

.tabs .active{
    background:white;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.input{
    width:100%;
    padding:15px;
    border:1px solid #ded8e2;
    border-radius:14px;
    outline:none;
    margin-bottom:12px;
    font-size:15px;
}

.input:focus{
    border-color:#b05cff;
}

.mainButton{
    width:100%;
    border:0;
    padding:15px;
    border-radius:14px;
    background:linear-gradient(135deg,#a855f7,#ec4899);
    color:white;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
}

.message{
    text-align:center;
    margin-top:14px;
    font-size:14px;
}

/* APP */

header{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(15px);
    border-bottom:1px solid rgba(0,0,0,.05);
    position:sticky;
    top:0;
    z-index:10;
}

.brand{
    font-size:21px;
    font-weight:bold;
}

.brand span{
    color:#a855f7;
}

.logout{
    border:0;
    background:#f0ebf3;
    padding:10px 14px;
    border-radius:11px;
    cursor:pointer;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px 18px 60px;
}

.welcome{
    margin-bottom:25px;
}

.welcome h2{
    font-size:29px;
    margin-bottom:6px;
}

.welcome p{
    color:#77717c;
}

.editor{
    background:rgba(255,255,255,.9);
    border-radius:24px;
    padding:20px;
    box-shadow:0 15px 45px rgba(70,50,80,.1);
}

#title{
    width:100%;
    border:0;
    outline:none;
    font-size:23px;
    font-weight:bold;
    background:transparent;
    margin-bottom:15px;
}

#text{
    width:100%;
    min-height:190px;
    resize:vertical;
    border:0;
    outline:none;
    background:transparent;
    font-size:16px;
    line-height:1.7;
}

.editorBottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:15px;
}

.save{
    border:0;
    background:#29252d;
    color:white;
    padding:12px 20px;
    border-radius:13px;
    font-weight:bold;
    cursor:pointer;
}

.status{
    color:#77717c;
    font-size:13px;
}

.entries{
    margin-top:35px;
}

.entries h3{
    margin-bottom:15px;
}

.entry{
    background:rgba(255,255,255,.92);
    border-radius:20px;
    padding:20px;
    margin-bottom:14px;
    box-shadow:0 8px 25px rgba(70,50,80,.07);
}

.date{
    font-size:12px;
    color:#99909f;
    margin-bottom:8px;
}

.entry h4{
    font-size:19px;
    margin-bottom:9px;
}

.entry p{
    white-space:pre-wrap;
    line-height:1.6;
    color:#554f58;
}

.delete{
    margin-top:15px;
    border:0;
    background:#fff0f3;
    color:#d83d63;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
}

.empty{
    text-align:center;
    color:#89818d;
    padding:30px;
}

@media(max-width:600px){
    .card{
        padding:24px 19px;
    }

    .welcome h2{
        font-size:25px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

<div class="card">

<div class="logo">📖</div>

<h1>Meu Diário</h1>

<p class="subtitle">
Seu espaço particular.
</p>

<div class="tabs">

<button id="loginTab"
class="active"
onclick="changeMode('login')">
Entrar
</button>

<button id="registerTab"
onclick="changeMode('register')">
Criar conta
</button>

</div>

<input
id="username"
class="input"
placeholder="Nome de usuário"
autocomplete="username">

<input
id="password"
class="input"
type="password"
placeholder="Senha"
autocomplete="current-password">

<button
class="mainButton"
onclick="authenticate()">

<span id="buttonText">
Entrar
</span>

</button>

<div
id="message"
class="message">
</div>

</div>

</div>


<!-- DIÁRIO -->

<div id="app" class="hidden">

<header>

<div class="brand">
📖 <span>Meu Diário</span>
</div>

<button
class="logout"
onclick="logout()">
Sair
</button>

</header>

<main class="container">

<div class="welcome">

<h2>
Olá, <span id="userName"></span>! 👋
</h2>

<p>
Escreva o que quiser. Este é o seu espaço.
</p>

</div>


<div class="editor">

<input
id="title"
placeholder="Título da página...">

<textarea
id="text"
placeholder="Comece a escrever aqui..."></textarea>

<div class="editorBottom">

<span
id="status"
class="status">
Tudo pronto.
</span>

<button
class="save"
onclick="saveEntry()">
💾 Salvar
</button>

</div>

</div>


<div class="entries">

<h3>
📚 Minhas páginas
</h3>

<div id="entriesList"></div>

</div>

</main>

</div>


<script>

let mode="login";
let currentUser=null;


/* =========================
   UTILIDADES
========================= */

function getUsers(){

    return JSON.parse(
        localStorage.getItem("diary_users") || "{}"
    );

}


function saveUsers(users){

    localStorage.setItem(
        "diary_users",
        JSON.stringify(users)
    );

}


function getDiaryKey(){

    return "diary_entries_" + currentUser;

}


function getEntries(){

    return JSON.parse(
        localStorage.getItem(getDiaryKey()) || "[]"
    );

}


function saveEntries(entries){

    localStorage.setItem(
        getDiaryKey(),
        JSON.stringify(entries)
    );

}


/* =========================
   LOGIN / CADASTRO
========================= */

function changeMode(newMode){

    mode=newMode;

    const loginTab=
        document.getElementById("loginTab");

    const registerTab=
        document.getElementById("registerTab");

    const buttonText=
        document.getElementById("buttonText");

    loginTab.classList.remove("active");
    registerTab.classList.remove("active");

    if(mode==="login"){

        loginTab.classList.add("active");

        buttonText.textContent="Entrar";

    }else{

        registerTab.classList.add("active");

        buttonText.textContent="Criar conta";

    }

    document.getElementById("message").textContent="";

}


function authenticate(){

    const username=
        document.getElementById("username")
        .value
        .trim()
        .toLowerCase();

    const password=
        document.getElementById("password")
        .value;

    const message=
        document.getElementById("message");

    if(!username || !password){

        message.textContent=
            "Preencha todos os campos.";

        return;

    }

    if(username.length<3){

        message.textContent=
            "O nome precisa ter pelo menos 3 caracteres.";

        return;

    }

    if(password.length<6){

        message.textContent=
            "A senha precisa ter pelo menos 6 caracteres.";

        return;

    }

    const users=getUsers();


    if(mode==="register"){

        if(users[username]){

            message.textContent=
                "Esse usuário já existe.";

            return;

        }

        users[username]={
            password:password
        };

        saveUsers(users);

        message.textContent=
            "Conta criada! Entrando...";

        setTimeout(()=>{
            login(username);
        },500);

    }else{

        if(!users[username]){

            message.textContent=
                "Usuário ou senha incorretos.";

            return;

        }

        if(users[username].password!==password){

            message.textContent=
                "Usuário ou senha incorretos.";

            return;

        }

        login(username);

    }

}


/* =========================
   ENTRAR
========================= */

function login(username){

    currentUser=username;

    sessionStorage.setItem(
        "current_diary_user",
        username
    );

    document
        .getElementById("loginPage")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    document
        .getElementById("userName")
        .textContent=username;

    loadEntries();

}


/* =========================
   SAIR
========================= */

function logout(){

    currentUser=null;

    sessionStorage.removeItem(
        "current_diary_user"
    );

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("loginPage")
        .classList.remove("hidden");

    document.getElementById("username").value="";
    document.getElementById("password").value="";
    document.getElementById("message").textContent="";

}


/* =========================
   SALVAR PÁGINA
========================= */

function saveEntry(){

    const title=
        document.getElementById("title")
        .value
        .trim();

    const text=
        document.getElementById("text")
        .value
        .trim();

    const status=
        document.getElementById("status");

    if(!text){

        status.textContent=
            "Escreva alguma coisa primeiro.";

        return;

    }

    const entries=getEntries();

    entries.unshift({

        id:Date.now(),

        title:title || "Sem título",

        text:text,

        date:new Date().toLocaleString(
            "pt-BR"
        )

    });

    saveEntries(entries);

    document.getElementById("title").value="";
    document.getElementById("text").value="";

    status.textContent=
        "✓ Página salva!";

    loadEntries();

}


/* =========================
   MOSTRAR PÁGINAS
========================= */

function loadEntries(){

    const list=
        document.getElementById("entriesList");

    const entries=getEntries();

    list.innerHTML="";

    if(entries.length===0){

        list.innerHTML=
        '<div class="empty">Você ainda não escreveu nada. ✨</div>';

        return;

    }

    entries.forEach(entry=>{

        const div=
            document.createElement("div");

        div.className="entry";

        div.innerHTML=`

            <div class="date">
                ${escapeHTML(entry.date)}
            </div>

            <h4>
                ${escapeHTML(entry.title)}
            </h4>

            <p>
                ${escapeHTML(entry.text)}
            </p>

            <button
                class="delete"
                onclick="deleteEntry(${entry.id})">
                🗑️ Excluir
            </button>

        `;

        list.appendChild(div);

    });

}


/* =========================
   EXCLUIR
========================= */

function deleteEntry(id){

    if(!confirm(
        "Quer excluir esta página?"
    )){
        return;
    }

    let entries=getEntries();

    entries=entries.filter(
        entry=>entry.id!==id
    );

    saveEntries(entries);

    loadEntries();

}


/* =========================
   SEGURANÇA DO TEXTO
========================= */

function escapeHTML(text){

    return String(text)

        .replaceAll("&","&amp;")

        .replaceAll("<","&lt;")

        .replaceAll(">","&gt;")

        .replaceAll('"',"&quot;")

        .replaceAll("'","&#039;");

}


/* =========================
   RECUPERAR SESSÃO
========================= */

function checkLogin(){

    const savedUser=
        sessionStorage.getItem(
            "current_diary_user"
        );

    if(savedUser){

        const users=getUsers();

        if(users[savedUser]){

            login(savedUser);

        }

    }

}

checkLogin();

</script>

</body>
  </html>
